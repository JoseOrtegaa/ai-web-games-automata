name: Ferret Jump QA
on:
  push:
    paths:
      - 'huroner-platformer/**'
      - '.github/workflows/ferret-jump-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: huroner-platformer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: huroner-platformer/package-lock.json
      - run: npm ci
      - run: npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser gameplay and mobile QA
        run: |
          python3 -m http.server 8123 --directory .. > /tmp/ferret-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8123/huroner-platformer/dist/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ferret-jump-qa
          path: huroner-platformer/test-results/
          retention-days: 14
