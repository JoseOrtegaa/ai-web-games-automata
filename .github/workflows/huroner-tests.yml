name: Huroner Survivor tests

on:
  pull_request:
    paths:
      - 'huroner-survivor/**'
      - '.github/workflows/huroner-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run tests
        working-directory: huroner-survivor
        run: node --test tests/*.test.js
